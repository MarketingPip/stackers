name: Build and Publish Stackers Game

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # REQUIRED to create a release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # ✅ Build step
      - name: Build Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run build:exe -- --win portable --ia32
          else
            npm run build:exe
          fi
        shell: bash

      # Create platform-specific release archives
      - name: Create Windows Release Zip
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # Option A: Zip the unpacked app folder (recommended for portable use)
          $source = "dist/win-ia32-unpacked"
          if (Test-Path $source) {
            Compress-Archive -Path "$source\*" -DestinationPath "dist/openstacker_win.zip" -Force
          } else {
            # Fallback: zip all .exe files in dist
            Get-ChildItem -Path "dist" -Filter "*.exe" | ForEach-Object {
              Compress-Archive -Path $_.FullName -DestinationPath "dist/openstacker_win.zip" -Force
            }
          }

      - name: Create Linux Release Tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Option A: Tar the unpacked app folder
          if [ -d "dist/linux-unpacked" ]; then
            tar -czf dist/openstacker_linux.tar.gz -C dist/linux-unpacked .
          else
            # Fallback: tar all Linux artifacts (.AppImage, .deb)
            cd dist
            tar -czf openstacker_linux.tar.gz *.AppImage *.deb 2>/dev/null || tar -czf openstacker_linux.tar.gz .
          fi
        shell: bash

      # Generate the ESM Library from CommonJS source
      - name: Build ESM Library
        run: npm run build:library

      # Commit the ESM bundle (Only runs on Linux to avoid duplicates)
      - name: Commit ESM Library
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/game.js
          # Only commit if there are changes to avoid workflow failure
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update esm library bundle [skip ci]" && git push)
        shell: bash

      # ✅ Upload to a single release with specific archive names
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/openstacker_win.zip
            dist/openstacker_linux.tar.gz
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
